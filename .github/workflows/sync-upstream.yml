name: Sync Upstream

on:
  # Run daily at midnight UTC
  schedule:
    - cron: '0 0 * * *'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      force_merge:
        description: 'Force merge even if conflicts detected (will attempt auto-resolution)'
        required: false
        default: false
        type: boolean
      target_branch:
        description: 'Target branch to sync (default: feature/add-copilot-support)'
        required: false
        default: 'feature/add-copilot-support'
        type: string

env:
  UPSTREAM_REPO: 'kilocode/kilocode'
  DEFAULT_BRANCH: 'feature/add-copilot-support'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_branch || env.DEFAULT_BRANCH }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git || true
          git fetch upstream main

      - name: Check for new commits
        id: check_commits
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/main)
          MERGE_BASE=$(git merge-base HEAD upstream/main)
          
          if [ "$UPSTREAM_SHA" = "$MERGE_BASE" ]; then
            echo "already_synced=true" >> $GITHUB_OUTPUT
            echo "✅ Already up to date with upstream"
          else
            COMMIT_COUNT=$(git rev-list --count $MERGE_BASE..$UPSTREAM_SHA)
            echo "already_synced=false" >> $GITHUB_OUTPUT
            echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
            echo "📦 Found $COMMIT_COUNT new commits from upstream"
          fi

      - name: Attempt merge
        id: merge
        if: steps.check_commits.outputs.already_synced != 'true'
        continue-on-error: true
        run: |
          git merge upstream/main --no-edit 2>&1 | tee merge_output.txt
          
          if [ ${PIPESTATUS[0]} -eq 0 ]; then
            echo "merge_success=true" >> $GITHUB_OUTPUT
            echo "✅ Merge completed successfully"
          else
            echo "merge_success=false" >> $GITHUB_OUTPUT
            echo "⚠️ Merge conflicts detected"
            
            # List conflicted files
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            echo "conflicts<<EOF" >> $GITHUB_OUTPUT
            echo "$CONFLICTS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Auto-resolve known conflict patterns
        id: auto_resolve
        if: steps.merge.outputs.merge_success == 'false'
        run: |
          RESOLVED_COUNT=0
          UNRESOLVED_FILES=""
          
          # Get list of conflicted files
          CONFLICTS=$(git diff --name-only --diff-filter=U)
          
          for file in $CONFLICTS; do
            RESOLVED=false
            
            # Pattern 1: Provider index exports (src/api/providers/index.ts)
            if [[ "$file" == "src/api/providers/index.ts" ]]; then
              echo "🔧 Auto-resolving provider index: $file"
              # Accept both versions by keeping all unique exports
              git checkout --theirs "$file"
              # Ensure copilot export exists
              if ! grep -q "CopilotHandler" "$file"; then
                echo 'export { CopilotHandler } from "./copilot"' >> "$file"
              fi
              git add "$file"
              RESOLVED=true
            fi
            
            # Pattern 2: Provider settings arrays (packages/types/src/provider-settings.ts)
            if [[ "$file" == "packages/types/src/provider-settings.ts" ]]; then
              echo "🔧 Auto-resolving provider settings: $file"
              # Use theirs as base, ensure copilot entries exist
              git checkout --theirs "$file"
              
              # Check if copilotModelId is in modelIdKeys
              if ! grep -q '"copilotModelId"' "$file"; then
                # Add copilotModelId to the array
                sed -i 's/\] as const satisfies/"copilotModelId",\n] as const satisfies/' "$file"
              fi
              
              git add "$file"
              RESOLVED=true
            fi
            
            # Pattern 3: Dynamic providers array
            if [[ "$file" == *"provider"* ]] && grep -q "dynamicProviders\|providerNames" "$file" 2>/dev/null; then
              echo "🔧 Attempting to resolve provider array: $file"
              git checkout --theirs "$file"
              
              # Ensure copilot is in the arrays
              if grep -q "dynamicProviders" "$file" && ! grep -q '"copilot"' "$file"; then
                sed -i 's/\] as const/  "copilot",\n] as const/' "$file"
              fi
              
              git add "$file"
              RESOLVED=true
            fi
            
            # Pattern 4: CLI constants (labels, validation)
            if [[ "$file" == "cli/src/constants/providers/"* ]]; then
              echo "🔧 Auto-resolving CLI constants: $file"
              git checkout --theirs "$file"
              
              # Ensure copilot entries exist in labels
              if [[ "$file" == *"labels.ts"* ]] && ! grep -q 'copilot:' "$file"; then
                sed -i 's/} as const/  copilot: "GitHub Copilot",\n} as const/' "$file"
              fi
              
              git add "$file"
              RESOLVED=true
            fi
            
            # Pattern 5: Markdown/documentation files
            if [[ "$file" == *.md ]]; then
              echo "🔧 Auto-resolving documentation: $file"
              git checkout --theirs "$file"
              git add "$file"
              RESOLVED=true
            fi
            
            # Pattern 6: Lock files
            if [[ "$file" == "pnpm-lock.yaml" ]] || [[ "$file" == "package-lock.json" ]]; then
              echo "🔧 Auto-resolving lock file: $file"
              git checkout --theirs "$file"
              git add "$file"
              RESOLVED=true
            fi
            
            if [ "$RESOLVED" = true ]; then
              ((RESOLVED_COUNT++))
            else
              UNRESOLVED_FILES="$UNRESOLVED_FILES $file"
            fi
          done
          
          echo "resolved_count=$RESOLVED_COUNT" >> $GITHUB_OUTPUT
          echo "unresolved_files=$UNRESOLVED_FILES" >> $GITHUB_OUTPUT
          
          # Check if all conflicts are resolved
          REMAINING=$(git diff --name-only --diff-filter=U | wc -l)
          if [ "$REMAINING" -eq 0 ]; then
            echo "all_resolved=true" >> $GITHUB_OUTPUT
            echo "✅ All conflicts resolved automatically"
          else
            echo "all_resolved=false" >> $GITHUB_OUTPUT
            echo "⚠️ $REMAINING files still have conflicts"
          fi

      - name: Commit resolved merge
        id: commit_merge
        if: steps.auto_resolve.outputs.all_resolved == 'true'
        run: |
          git commit -m "chore: sync with upstream kilocode/kilocode

          Auto-merged ${{ steps.check_commits.outputs.commit_count }} commits from upstream.
          Resolved ${{ steps.auto_resolve.outputs.resolved_count }} conflict(s) automatically.
          
          Preserved custom providers:
          - Copilot provider (GitHub Copilot integration)
          
          [skip ci]"
          
          echo "commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Install dependencies and build
        id: build
        if: steps.merge.outputs.merge_success == 'true' || steps.auto_resolve.outputs.all_resolved == 'true'
        continue-on-error: true
        run: |
          npm install -g pnpm
          pnpm install
          pnpm run build
          
          if [ $? -eq 0 ]; then
            echo "build_success=true" >> $GITHUB_OUTPUT
            echo "✅ Build successful"
          else
            echo "build_success=false" >> $GITHUB_OUTPUT
            echo "❌ Build failed"
          fi

      - name: Run tests
        id: test
        if: steps.build.outputs.build_success == 'true'
        continue-on-error: true
        run: |
          pnpm run test 2>&1 | head -100 || true
          echo "tests_run=true" >> $GITHUB_OUTPUT

      - name: Push changes
        if: steps.build.outputs.build_success == 'true'
        run: |
          git push origin ${{ inputs.target_branch || env.DEFAULT_BRANCH }}
          echo "✅ Changes pushed successfully"

      - name: Create PR for manual resolution
        if: steps.auto_resolve.outputs.all_resolved == 'false' && steps.merge.outputs.merge_success == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const conflicts = `${{ steps.merge.outputs.conflicts }}`.split('\n').filter(f => f);
            const unresolved = `${{ steps.auto_resolve.outputs.unresolved_files }}`.trim().split(' ').filter(f => f);
            
            const body = `## ⚠️ Upstream Sync Requires Manual Intervention

            The automated sync from upstream \`${{ env.UPSTREAM_REPO }}\` encountered conflicts that could not be automatically resolved.

            ### Conflicted Files
            ${conflicts.map(f => `- \`${f}\``).join('\n')}

            ### Files Requiring Manual Resolution
            ${unresolved.map(f => `- \`${f}\``).join('\n')}

            ### Instructions
            1. Checkout the branch: \`git checkout ${{ inputs.target_branch || env.DEFAULT_BRANCH }}\`
            2. Fetch upstream: \`git fetch upstream main\`
            3. Merge manually: \`git merge upstream/main\`
            4. Resolve conflicts, ensuring:
               - Copilot provider exports are preserved
               - Both custom and upstream providers are included
            5. Build and test: \`pnpm install && pnpm run build\`
            6. Push changes

            ### Auto-Resolution Stats
            - Resolved automatically: ${{ steps.auto_resolve.outputs.resolved_count }} files
            - Remaining conflicts: ${unresolved.length} files
            `;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔄 Upstream Sync Requires Manual Resolution',
              body: body,
              labels: ['upstream-sync', 'needs-attention']
            });

      - name: Create issue for build failure
        if: steps.build.outputs.build_success == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '❌ Upstream Sync Build Failed',
              body: `## Build Failure After Upstream Sync

              The merge from upstream was successful, but the build failed.

              ### Commit
              - SHA: ${{ steps.commit_merge.outputs.commit_sha || 'N/A' }}

              ### Action Required
              1. Check the build logs for errors
              2. Common issues:
                 - Missing dependencies (run \`pnpm install\`)
                 - Type errors from upstream changes
                 - Breaking API changes

              ### Build Log
              Check the [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.
              `,
              labels: ['upstream-sync', 'build-failure']
            });

      - name: Summary
        if: always()
        run: |
          echo "## Upstream Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.check_commits.outputs.already_synced }}" = "true" ]; then
            echo "✅ Already up to date with upstream" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.merge.outputs.merge_success }}" = "true" ]; then
            echo "✅ Clean merge completed" >> $GITHUB_STEP_SUMMARY
            echo "- Commits merged: ${{ steps.check_commits.outputs.commit_count }}" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.auto_resolve.outputs.all_resolved }}" = "true" ]; then
            echo "✅ Merge completed with auto-resolved conflicts" >> $GITHUB_STEP_SUMMARY
            echo "- Commits merged: ${{ steps.check_commits.outputs.commit_count }}" >> $GITHUB_STEP_SUMMARY
            echo "- Conflicts resolved: ${{ steps.auto_resolve.outputs.resolved_count }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Manual intervention required" >> $GITHUB_STEP_SUMMARY
            echo "- See created issue for details" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.build.outputs.build_success }}" = "true" ]; then
            echo "✅ Build successful" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.build.outputs.build_success }}" = "false" ]; then
            echo "❌ Build failed" >> $GITHUB_STEP_SUMMARY
          fi